# mkdocs/mkdocs.yml



site_name: 柯格鐘稅法課程筆記
site_description: 柯格鐘（台大）稅法課程與筆記整理（所得稅法、稅法重點、課堂逐字稿）
site_url: https://mt019.github.io/1140_NTU_Tax_Ko/
docs_dir: My_Notes
use_directory_urls: true
repo_url: https://github.com/mt019/1140_NTU_Tax_Ko
repo_name: mt019/1140_NTU_Tax_Ko


theme:
  name: material
  language: zh-TW
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.footer        # 產生頁腳的上一頁/下一頁
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
  # 字體自帶（assets/fonts/ 的 woff2 子集，phenom 通用設計），不載 Google Fonts。
  font: false
plugins:
  - awesome-pages
  - course_merge
  # 校對中閘門：清單裡的頁建站時整頁換成「校對中」告示並退出搜尋索引；
  # 原始檔不動，校對完成後把該頁從清單移除即恢復顯示。
  # 清單依據：_work/照抄率_1121.md（原話涵蓋 ≥ 0.499 與未編輯逐字稿無異）
  # 與 scripts/audit-spoken-residue.py（口語殘留超過 1.86／千字），取聯集；
  # 空白頁一併標示。
  - proofread_gate:
      pages:
        - 1121/1121_租稅法總論/001_20230905_03_租稅法總論.md
        - 1121/1121_租稅法總論/003_20230912_03_租稅法總論.md
        - 1121/1121_租稅法總論/004_20230912_04_租稅法總論.md
        - 1121/1121_租稅法總論/005_20230919_03_租稅法總論.md
        - 1121/1121_租稅法總論/007_20230926_03_租稅法總論.md
        - 1121/1121_租稅法總論/008_20230926_04_租稅法總論.md
        - 1121/1121_租稅法總論/009_20231003_03_租稅法總論.md
        - 1121/1121_租稅法總論/010_20231003_04_租稅法總論.md
        - 1121/1121_租稅法總論/014_20231024_04_租稅法總論.md
        - 1121/1121_租稅規避/20230905_01_稅捐規避.md
        - 1121/1121_租稅規避/20230905_02_稅捐規避.md
        - 1121/1121_租稅規避/20230912_01_稅捐規避.md
        - 1121/1121_租稅規避/20230912_02_稅捐規避.md
        - 1121/1121_租稅規避/20230919_01_稅捐規避.md
        - 1121/1121_租稅規避/20230919_02_稅捐規避.md
        - 1121/1121_租稅規避/20230926_01_稅捐規避.md
        - 1121/1121_租稅規避/20230926_02_稅捐規避.md
        - 1121/1121_租稅規避/20231003_01_稅捐規避.md
        - 1121/1121_租稅規避/20231003_02_稅捐規避.md
        - 1121/1121_租稅規避/20231017_02_稅捐規避.md
        - 1121/1121_租稅規避/20231024_02_稅捐規避.md
        - 1121/1121_租稅規避/20231031_01_稅捐規避.md
        - 1121/1121_租稅規避/20231031_02_稅捐規避.md
        - 1121/1121_租稅規避/20231107_01_稅捐規避.md
        - 1121/1121_租稅規避/20231107_02_稅捐規避.md
        - 1121/1121_租稅規避/20231114_01_稅捐規避.md
        - 1121/1121_租稅規避/20231114_02_稅捐規避.md
        - 1121/1121_租稅規避/20231121_01_稅捐規避.md
        - 1121/1121_租稅規避/20231205_01_稅捐規避.md
        - 1121/1121_租稅規避/20231205_02_稅捐規避.md
        - 1121/1121_租稅規避/20231212_01_稅捐規避.md
        - 1121/1121_租稅規避/20231212_02_稅捐規避.md
      merged:
        - 1121/1121_租稅法總論/_1121_租稅法總論_合併.md
  - search:
      lang:
        - zh
      jieba_dict_user: jieba_userdict.txt
  - heading_index
  # Notebook 顯示策略：
  # 1) 完全不轉換/不顯示：保持 mkdocs-jupyter 註解 + 排除 notebooks/**。
  # 2) 仍可轉換但不顯示於導覽：啟用 mkdocs-jupyter，並在 nav/awesome-pages 規則中隱藏。
  # - mkdocs-jupyter
      # execute: false  # 先不在建站時執行筆記本
  - multiline_abbr
  - exclude:
      # 使用大規則排除草稿與雜項資料
      glob:
        - '_老師要的其他文件/**'
        - '_downloads_lawtmp/**'
        - '*_.md'
        - '**/*稿*.*'
        - '**/_*/**'
        - 'includes/**'
        - 'notebooks/**'
        - 'jupyter/**'
        - '**/.DS_Store'
        - '**/*abbreviations.md'
        - '**/不用的廢稿/**'

markdown_extensions:
  - toc:
      toc_depth: "2-4"   # 顯示到 ####，避免右側 TOC 過短或缺段
  # 支援頁面 meta（SEO / 社群卡片）
  - meta
  # 支援提示框
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        # - includes/abbreviations.md

  # 支援 Mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # 嚴格列表縮排（子項必須 2 空白）
  - mdx_truly_sane_lists:
      nested_indent: 2

  # 支援數學公式
  - pymdownx.arithmatex:
      generic: true


extra_css:
  - assets/extra.css   # 若有

extra_javascript:
  # 自訂腳本
  - assets/keynav.js           # 鍵盤導航
  - assets/extra.js

  # MathJax
  - assets/mathjax-config.js   # 配置（需在主程式前）
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

  # Mermaid（若使用 mermaid2 plugin 則可省略以下兩行）
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js
